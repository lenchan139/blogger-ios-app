<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Blogger Editor</title>
    <style>
        :root {
            --accent: #f57c03;
            --fg: #37352f;
            --fg-soft: rgba(55, 53, 47, 0.6);
            --bg-hover: rgba(55, 53, 47, 0.06);
            --border: rgba(55, 53, 47, 0.13);
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        body {
            font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
            padding: 8px;
            box-sizing: border-box;
        }

        /* ---- Editor content ---- */
        .tiptap {
            font-size: 17px;
            line-height: 1.6;
            color: var(--fg);
            min-height: 240px;
            padding: 12px 4px;
            outline: none;
        }
        .tiptap > * + * { margin-top: 0.35em; }
        .tiptap p.is-editor-empty:first-child::before {
            content: attr(data-placeholder);
            color: var(--fg-soft);
            float: left;
            height: 0;
            pointer-events: none;
        }
        .tiptap h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin: 0.7em 0 0.3em; }
        .tiptap h2 { font-size: 24px; font-weight: 600; margin: 0.7em 0 0.3em; }
        .tiptap h3 { font-size: 20px; font-weight: 600; margin: 0.7em 0 0.3em; }
        .tiptap h4 { font-size: 17px; font-weight: 600; margin: 0.7em 0 0.3em; }
        .tiptap ul, .tiptap ol { padding-left: 1.5em; }
        .tiptap img { max-width: 100%; height: auto; border-radius: 4px; }
        .tiptap img.ProseMirror-selectednode { outline: 2px solid var(--accent); }
        .tiptap blockquote {
            border-left: 3px solid var(--border);
            margin-left: 0; padding-left: 14px;
            color: var(--fg-soft);
        }
        .tiptap a { color: var(--accent); text-decoration: underline; }
        .tiptap hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
        .tiptap pre {
            background: var(--bg-hover);
            border-radius: 4px;
            padding: 12px 14px;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 14px;
        }
        .tiptap code {
            background: var(--bg-hover);
            border-radius: 4px;
            padding: 1px 4px;
            font-family: ui-monospace, SFMono-Regular, monospace;
        }
        .tiptap pre code { background: none; padding: 0; }
        .tiptap mark { background: #ffe58f; border-radius: 2px; padding: 0 2px; }

        /* ---- Cursor-traced floating toolbar ---- */
        .cursor-toolbar {
            position: absolute;
            z-index: 300;
            display: none;
            align-items: center;
            gap: 1px;
            padding: 5px 6px;
            background: #191919;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            max-width: calc(100vw - 12px);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .cursor-toolbar::-webkit-scrollbar { display: none; }
        .cursor-toolbar.is-visible { display: flex; }
        .cursor-toolbar button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #f2f2f7;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .cursor-toolbar button svg { width: 16px; height: 16px; }
        .cursor-toolbar button:active { opacity: 0.5; }
        .cursor-toolbar button.is-active { background: var(--accent); color: #fff; }
        .cursor-toolbar .tsep {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 3px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="editor"></div>

    <script src="tiptap.js"></script>
    <script>
        window.onerror = function (msg, src, line) {
            try { window.webkit.messageHandlers.editorError.postMessage(msg + ' @' + line); } catch (e) {}
            return false;
        };

        function boot() {
            if (typeof BloggerTipTap === 'undefined') {
                window.webkit.messageHandlers.editorError.postMessage('BloggerTipTap undefined');
                return;
            }
            BloggerTipTap.init('editor', 'Write your post…');
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }

        // Sync active states on the cursor toolbar from editor state.
        function syncContextMenus(state) {
            document.querySelectorAll('.cursor-toolbar button[data-tcmd]').forEach(function (btn) {
                var cmd = btn.getAttribute('data-tcmd');
                var active = false;
                switch (cmd) {
                    case 'bold': active = !!state.bold; break;
                    case 'italic': active = !!state.italic; break;
                    case 'underline': active = !!state.underline; break;
                    case 'strike': active = !!state.strike; break;
                    case 'code': active = !!state.code; break;
                    case 'highlight': active = !!state.highlight; break;
                    case 'bullet': active = !!state.bulletList; break;
                    case 'ordered': active = !!state.orderedList; break;
                    case 'quote': active = !!state.blockquote; break;
                    case 'h1': active = state.heading === 1; break;
                    case 'h2': active = state.heading === 2; break;
                    case 'h3': active = state.heading === 3; break;
                    case 'alignLeft': active = !!state.alignLeft; break;
                    case 'alignCenter': active = !!state.alignCenter; break;
                    case 'alignRight': active = !!state.alignRight; break;
                    case 'link': active = !!state.hasLink; break;
                    default: break;
                }
                btn.classList.toggle('is-active', active);
            });
        }
    </script>
</body>
</html>
